# Local demo.
#   Hosted LLM (Groq / Gemini / OpenRouter):  cp .env.example .env, fill it in, then
#                                             docker compose up --build
#   Fully local LLM with Ollama:              docker compose --profile ollama up --build
#   Rules only, no LLM:                       docker compose up --build   (with no .env)
# Then open http://localhost:8080 (admin / admin unless changed).
services:
  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

  # Optional: free local model server. Start with --profile ollama and set in .env:
  #   LLM_BASE_URL=http://ollama:11434/v1   LLM_MODEL=qwen2.5:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # One-shot helper that downloads the model into the ollama service (about 2 GB for 3B models).
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  jenkins_home:
  ollama_models:
